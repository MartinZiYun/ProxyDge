help.text: |
  ProxyDge — PROXY Protocol 归一化网关。

  用法：
    proxydge <命令> [选项]

  命令：
    start     运行网关。
    init      生成示例 config.yaml。
    version   打印版本与构建信息。
    help      显示此帮助。

  配置优先级（从高到低）：
    CLI 参数  >  环境变量 (PROXYDGE_*)  >  配置文件  >  默认值

  配置文件自动从 <可执行文件目录>/config.yaml 发现；可用 -config 覆盖。
  以下选项均用于 'start' 命令（除非另行说明）。

  start 选项：
    -protocol <p>                   tcp|udp — 选择网关模式 (默认 "tcp")
    -listen <addr>                  监听地址 (默认 ":9000")
    -upstream <host:port>           下游目标 (默认 "127.0.0.1:9001")
    -policy <p>                     use|require|reject (默认 "use")
    -trusted-networks <cidrs>       可信网段 (逗号分隔 CIDR 或裸 IP, 空=全部信任)
    -untrusted-proxy-action <a>     reject|strip (默认 "reject")
    -config <path>                  配置文件路径
    -lang <locale>                  显示语言: en|zh-CN|zh-TW (默认自动)
    -tcp-detect-timeout <dur>       PROXY 头探测超时 (0=无限等待, 默认 1s)
    -tcp-idle-timeout <dur>         管道空闲超时, 0=禁用 (默认 5m)
    -tcp-header-version <v>         下游 PROXY header 版本: v1|v2 (默认 "v2")
    -tcp-family-mismatch <a>        地址族不一致处置: reject|unknown|legacy (默认 "reject")
    -udp-idle-timeout <dur>        UDP session 空闲超时 (默认 30s)
    -udp-max-sessions <n>          最大并发 UDP session 数 (默认 1024)
    -udp-max-datagram-size <n>     最大数据报大小, 0=无限制 (默认 65535)
    -udp-header-mode <m>           every_datagram|first_datagram (默认 "every_datagram")
    -log-console-level <l>          debug|info|warn|error (默认 "info")
    -log-console-format <f>        text|json (默认 "text")
    -log-file <path>               文件日志路径 (空=禁用)
    -log-file-level <l>            debug|info|warn|error (默认 "info")
    -log-file-format <f>           text|json (默认 "text")

  init 选项：
    -config <path>                  示例配置写入位置 (默认: <exe-dir>/config.yaml)
    -force                          覆盖已有配置文件

warning.trusted_networks.empty: "trusted-networks 为空：所有来源均被信任。任何 IP 都可通过 PROXY header 伪造源地址。请在生产环境配置 trusted-networks。"
warning.untrusted_proxy_action.strip: "untrusted-proxy-action=strip：非可信来源的 PROXY header 将被剥离，改用真实套接字地址转发。它们仍可连接——使用 reject（默认）可拒绝。"
warning.family_mismatch.legacy: "tcp.family-mismatch=legacy：地址族不一致的头部将沿用历史自动转换行为，可能向下游发出 ::ffff: 映射形式的 IPv4 地址（标记为 IPv6），严格的下游可能解析异常或误连。建议使用 reject 或 unknown。"
notice.config_migrated: "配置文件已迁移至版本 %d，备份位于 %s.bak"

# 标签
label.warning: "警告"
label.notice: "通知"

# 启动错误
