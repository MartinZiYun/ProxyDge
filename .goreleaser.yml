# GoReleaser config for tagged releases. ldflags inject the version metadata
# computed by the CI workflow (VERSION/BUILD_NUMBER/COMMIT/BUILD_TIME env vars).
# Targets: linux (amd64/arm64/arm-v7/386/riscv64/loong64), windows (amd64/arm64),
# darwin (amd64/arm64), freebsd (amd64). Invalid GOOS/GOARCH combos in the
# matrix below are skipped by GoReleaser automatically; explicit ignores cover
# the VALID-but-unwanted combos (windows/386, freebsd/arm, freebsd/386).
version: 2

project_name: proxydge

builds:
  - id: proxydge
    main: .
    binary: proxydge
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64, arm, 386, riscv64, loong64]
    goarm: ["7"]
    ignore:
      - goos: windows
        goarch: 386
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: 386
    ldflags:
      - -s -w
      - -X 'proxydge/internal/version.Version={{.Env.VERSION}}'
      - -X 'proxydge/internal/version.BuildNumber={{.Env.BUILD_NUMBER}}'
      - -X 'proxydge/internal/version.Commit={{.Env.COMMIT}}'
      - -X 'proxydge/internal/version.BuildTime={{.Env.BUILD_TIME}}'

archives:
  - id: default
    ids: [proxydge]
    # name_template uses GoReleaser's .Version (tag without leading v).
    name_template: >-
      proxydge-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^refactor:'

release:
  name_template: 'ProxyDge {{ .Version }}'
