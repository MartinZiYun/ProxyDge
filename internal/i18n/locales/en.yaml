help.text: |
  ProxyDge — PROXY Protocol normalizer.

  Usage:
    proxydge <command> [options]

  Commands:
    start     Run the gateway.
    init      Write a sample config.yaml.
    version   Print version and build info.
    help      Show this help.

  Configuration precedence (highest to lowest):
    CLI flags  >  env (PROXYDGE_*)  >  config file  >  defaults

  The config file is auto-discovered at <executable-dir>/config.yaml; override
  with -config. All options below apply to 'start' unless noted.

  start options:
    -protocol <p>                   tcp|udp — selects gateway mode (default "tcp")
    -listen <addr>                  listen address (default ":9000")
    -upstream <host:port>           downstream target (default "127.0.0.1:9001")
    -policy <p>                     use|require|reject (default "use")
    -trusted-networks <cidrs>       trusted networks (comma-separated CIDRs or IPs, empty=all)
    -untrusted-proxy-action <a>     reject|strip (default "reject")
    -config <path>                  config file path
    -lang <locale>                  display language: en|zh-CN|zh-TW (default auto)
    -tcp-detect-timeout <dur>       PROXY header detection timeout (0=block indefinitely, default 1s)
    -tcp-idle-timeout <dur>         pipe idle timeout, 0=disabled (default 5m)
    -udp-idle-timeout <dur>        UDP session idle timeout (default 30s)
    -udp-max-sessions <n>          max concurrent UDP sessions (default 1024)
    -udp-max-datagram-size <n>     max datagram size, 0=unlimited (default 65535)
    -udp-header-mode <m>           every_datagram|first_datagram (default "every_datagram")
    -log-console-level <l>          debug|info|warn|error (default "info")
    -log-console-format <f>        text|json (default "text")
    -log-file <path>               file log path (empty = disabled)
    -log-file-level <l>            debug|info|warn|error (default "info")
    -log-file-format <f>           text|json (default "text")

  init options:
    -config <path>                  where to write the sample (default: <exe-dir>/config.yaml)
    -force                          overwrite an existing config file

warning.trusted_networks.empty: "trusted-networks is empty: all sources are trusted. Any IP can spoof source addresses via PROXY headers. Configure trusted-networks in production."
warning.untrusted_proxy_action.strip: "untrusted-proxy-action=strip: non-trusted sources with PROXY headers will have their headers stripped and forwarded with real socket addresses. They can still connect — use reject (default) to deny them."
notice.config_migrated: "config file migrated to version %d, backup at %s.bak"
