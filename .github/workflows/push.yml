# Push workflow: builds a dev artifact (vX.Y.Z-dev.<build>) on push to main.
# Tags (v*) are handled by release.yml; this ignores them.
name: push

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the reusable CI must push the build-counter branch

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release: false

  dev-artifact:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build dev binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION:      ${{ needs.ci.outputs.version }}
          BUILD_NUMBER: ${{ needs.ci.outputs.build_number }}
          COMMIT:       ${{ needs.ci.outputs.commit }}
          BUILD_TIME:   ${{ needs.ci.outputs.build_time }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="proxydge-${VERSION}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "\
            -X 'proxydge/internal/version.Version=${VERSION}' \
            -X 'proxydge/internal/version.BuildNumber=${BUILD_NUMBER}' \
            -X 'proxydge/internal/version.Commit=${COMMIT}' \
            -X 'proxydge/internal/version.BuildTime=${BUILD_TIME}'" \
            -o "$out" .
          echo "built $out"
      - uses: actions/upload-artifact@v6
        with:
          name: proxydge-${{ needs.ci.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: proxydge-*
          if-no-files-found: error
