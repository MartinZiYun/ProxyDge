error.invalid_log_console_format: "配置：无效的 log console format %q (text|json)"
error.invalid_log_file_level: "配置：无效的 log file level %q (debug|info|warn|error)"
error.invalid_log_file_format: "配置：无效的 log file format %q (text|json)"
